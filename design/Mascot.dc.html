<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes km-sway{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(0.7deg)}}
@keyframes km-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
@keyframes km-wave{0%,100%{transform:rotate(-118deg)}50%{transform:rotate(-156deg)}}
@keyframes km-talk{0%,100%{transform:scaleY(0.55)}50%{transform:scaleY(1.35)}}
@keyframes km-gesture{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-8deg)}}
@keyframes km-point{0%,100%{transform:rotate(74deg)}50%{transform:rotate(82deg)}}
@keyframes km-shrug{0%,100%{transform:rotate(-40deg) translateY(0)}50%{transform:rotate(-52deg) translateY(-4px)}}
@keyframes km-dots{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes km-change{0%{transform:scale(1)}30%{transform:scale(1.06) rotate(-3deg)}60%{transform:scale(0.96) rotate(2deg)}100%{transform:scale(1)}}
@keyframes km-spark{0%{opacity:0;transform:scale(0.4)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
</style>
</helmet>

<div style="{{ wrapStyle }}">
  <svg viewBox="0 0 160 248" style="{{ svgStyle }}" role="img" aria-label="Кампи">
    <ellipse cx="80" cy="238" rx="34" ry="5.5" fill="#000" opacity="0.08"></ellipse>

    <g style="{{ figureStyle }}">

      <sc-if value="{{ isThinking }}" hint-placeholder-val="{{ false }}">
        <g>
          <circle cx="112" cy="20" r="4" fill="{{ primary }}" style="animation:km-dots 1.1s ease-in-out infinite"></circle>
          <circle cx="126" cy="16" r="4" fill="{{ primary }}" style="animation:km-dots 1.1s ease-in-out .18s infinite"></circle>
          <circle cx="140" cy="20" r="4" fill="{{ primary }}" style="animation:km-dots 1.1s ease-in-out .36s infinite"></circle>
        </g>
      </sc-if>

      <sc-if value="{{ isChanging }}" hint-placeholder-val="{{ false }}">
        <g>
          <circle cx="34" cy="70" r="3.5" fill="{{ primary }}" style="animation:km-spark .7s ease-out infinite"></circle>
          <circle cx="128" cy="52" r="3" fill="{{ primary }}" style="animation:km-spark .7s ease-out .2s infinite"></circle>
          <circle cx="120" cy="140" r="3" fill="{{ primary }}" style="animation:km-spark .7s ease-out .4s infinite"></circle>
        </g>
      </sc-if>

      <sc-if value="{{ hasBackpack }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="36" y="116" width="88" height="62" rx="20" fill="{{ packColor }}"></rect>
          <rect x="40" y="134" width="80" height="4" rx="2" fill="#000" opacity="0.14"></rect>
        </g>
      </sc-if>

      <rect x="61" y="172" width="14" height="50" rx="7" fill="#3a3733"></rect>
      <rect x="85" y="172" width="14" height="50" rx="7" fill="#3a3733"></rect>
      <rect x="56" y="214" width="21" height="13" rx="6.5" fill="#22201e"></rect>
      <rect x="83" y="214" width="21" height="13" rx="6.5" fill="#22201e"></rect>

      <sc-if value="{{ isHoodie }}" hint-placeholder-val="{{ true }}">
        <g>
          <rect x="50" y="110" width="60" height="76" rx="22" fill="{{ primary }}"></rect>
          <rect x="62" y="152" width="36" height="16" rx="8" fill="#000" opacity="0.12"></rect>
          <path d="M60 116 q20 18 40 0" fill="none" stroke="{{ secondary }}" stroke-width="3" stroke-linecap="round" opacity="0.9"></path>
        </g>
      </sc-if>
      <sc-if value="{{ isTshirt }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="52" y="110" width="56" height="66" rx="18" fill="{{ primary }}"></rect>
          <rect x="70" y="110" width="20" height="9" rx="4.5" fill="{{ secondary }}" opacity="0.85"></rect>
        </g>
      </sc-if>
      <sc-if value="{{ isVarsity }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="50" y="110" width="60" height="76" rx="20" fill="{{ secondary }}"></rect>
          <rect x="50" y="110" width="30" height="76" rx="20" fill="{{ primary }}"></rect>
          <rect x="76" y="110" width="8" height="76" fill="{{ primary }}" opacity="0.9"></rect>
          <rect x="50" y="178" width="60" height="8" rx="4" fill="{{ primary }}"></rect>
        </g>
      </sc-if>

      <sc-if value="{{ hasBackpack }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="60" y="110" width="7" height="42" rx="3.5" fill="{{ packColor }}" opacity="0.92"></rect>
          <rect x="93" y="110" width="7" height="42" rx="3.5" fill="{{ packColor }}" opacity="0.92"></rect>
        </g>
      </sc-if>


      <g style="{{ leftArmStyle }}">
        <rect x="41" y="114" width="13" height="56" rx="6.5" fill="{{ sleeveColor }}"></rect>
        <circle cx="47.5" cy="172" r="8" fill="#e8c6a8"></circle>
      </g>
      <g style="{{ rightArmStyle }}">
        <rect x="106" y="114" width="13" height="56" rx="6.5" fill="{{ sleeveColor }}"></rect>
        <circle cx="112.5" cy="172" r="8" fill="#e8c6a8"></circle>
      </g>

      <rect x="72" y="96" width="16" height="18" rx="7" fill="#dfb896"></rect>

      <sc-if value="{{ hasScarf }}" hint-placeholder-val="{{ false }}">
        <g>
          <rect x="56" y="98" width="48" height="16" rx="8" fill="{{ primary }}"></rect>
          <rect x="92" y="106" width="13" height="34" rx="6.5" fill="{{ primary }}" opacity="0.92"></rect>
          <rect x="60" y="102" width="40" height="3" rx="1.5" fill="{{ secondary }}" opacity="0.7"></rect>
        </g>
      </sc-if>

      <g>
        <circle cx="80" cy="66" r="35" fill="#3a3733"></circle>
        <circle cx="80" cy="72" r="33" fill="#e8c6a8"></circle>
        <circle cx="45" cy="74" r="6.5" fill="#dfb896"></circle>
        <circle cx="115" cy="74" r="6.5" fill="#dfb896"></circle>
        <rect x="49" y="40" width="62" height="20" rx="10" fill="#3a3733"></rect>

        <circle cx="66" cy="84" r="6" fill="{{ primary }}" opacity="0.14"></circle>
        <circle cx="94" cy="84" r="6" fill="{{ primary }}" opacity="0.14"></circle>

        <g style="{{ eyesStyle }}">
          <ellipse cx="69" cy="72" rx="4" ry="5" fill="#26241f"></ellipse>
          <ellipse cx="91" cy="72" rx="4" ry="5" fill="#26241f"></ellipse>
        </g>
        <rect x="63" y="60" width="12" height="3" rx="1.5" fill="#26241f" opacity="0.75"></rect>
        <rect x="85" y="60" width="12" height="3" rx="1.5" fill="#26241f" opacity="0.75"></rect>

        <ellipse cx="80" cy="89" rx="7" ry="4.5" fill="#26241f" style="{{ mouthStyle }}"></ellipse>

        <sc-if value="{{ hasCap }}" hint-placeholder-val="{{ false }}">
          <g>
            <rect x="48" y="30" width="64" height="24" rx="12" fill="{{ primary }}"></rect>
            <ellipse cx="80" cy="53" rx="37" ry="7" fill="{{ primary }}"></ellipse>
            <ellipse cx="80" cy="52" rx="37" ry="4" fill="#000" opacity="0.12"></ellipse>
          </g>
        </sc-if>
      </g>
    </g>
  </svg>
  <div style="{{ chestLabelStyle }}">{{ label }}</div>
  <sc-if value="{{ hasCap }}" hint-placeholder-val="{{ false }}">
    <div style="{{ capLabelStyle }}">{{ label }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:280},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;idle&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;hello&quot;,&quot;thinking&quot;,&quot;talking&quot;,&quot;pointing&quot;,&quot;dont_know&quot;,&quot;changing&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;top&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;hoodie&quot;,&quot;options&quot;:[&quot;hoodie&quot;,&quot;tshirt&quot;,&quot;varsity&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;head&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;cap&quot;,&quot;options&quot;:[&quot;cap&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accessory&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;backpack&quot;,&quot;options&quot;:[&quot;backpack&quot;,&quot;scarf&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;primary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8B0029&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f4f4f2&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;KU&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;min&quot;:80,&quot;max&quot;:420,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p = this.props;
    const state = p.state || "idle";
    const primary = p.primary || "oklch(0.55 0.14 265)";
    const secondary = p.secondary || "#f4f4f2";
    const top = p.top || "hoodie";
    const head = p.head || "cap";
    const acc = p.accessory || "backpack";
    const h = p.height || 200;

    const armBase = "transform-box:view-box;";
    const L = "transform-origin:47px 118px;", R = "transform-origin:112px 118px;";

    let bodyStyle = "animation:km-sway 3.6s ease-in-out infinite;transform-origin:50% 100%";
    let figureStyle = "", leftArmStyle = armBase+L, rightArmStyle = armBase+R;
    let mouthStyle = "transform-box:view-box;transform-origin:80px 89px;transform:scale(0.95,0.55);";
    let eyesStyle = "transform-box:view-box;transform-origin:80px 72px;animation:km-blink 5s ease-in-out infinite";

    if (state === "hello"){
      rightArmStyle += "animation:km-wave .6s ease-in-out infinite";
      mouthStyle += "transform:scaleY(1.15)";
    } else if (state === "thinking"){
      rightArmStyle += "transform:rotate(-142deg)";
      leftArmStyle += "transform:rotate(6deg)";
      mouthStyle += "transform:scaleY(0.5)";
    } else if (state === "talking"){
      mouthStyle += "animation:km-talk .3s ease-in-out infinite";
      leftArmStyle += "animation:km-gesture 1.4s ease-in-out infinite";
    } else if (state === "pointing"){
      rightArmStyle += "animation:km-point 1.1s ease-in-out infinite";
      mouthStyle += "transform:scaleY(0.9)";
    } else if (state === "dont_know"){
      leftArmStyle += "transform:rotate(38deg)";
      rightArmStyle += "animation:km-shrug 1.6s ease-in-out infinite";
      mouthStyle += "transform:scale(0.7,0.6)";
    } else if (state === "changing"){
      bodyStyle = "animation:km-change .55s ease-in-out infinite;transform-origin:50% 100%";
    }


    const labelColor = top === "varsity" || head === "cap" ? secondary : secondary;

    return {
      wrapStyle:"position:relative;display:flex;align-items:flex-end;justify-content:center;height:"+h+"px;user-select:none;"+bodyStyle,
      chestLabelStyle:"position:absolute;left:50%;top:"+(h*0.585)+"px;transform:translateX(-50%);pointer-events:none;"+
        "font-family:'Instrument Sans',Helvetica,sans-serif;font-weight:600;letter-spacing:0.04em;line-height:1;"+
        "font-size:"+(h*0.072).toFixed(1)+"px;color:"+(top==="varsity" ? primary : secondary),
      capLabelStyle:"position:absolute;left:50%;top:"+(h*0.145)+"px;transform:translateX(-50%);pointer-events:none;"+
        "font-family:'Instrument Sans',Helvetica,sans-serif;font-weight:600;line-height:1;"+
        "font-size:"+(h*0.046).toFixed(1)+"px;color:"+secondary,
      svgStyle:"height:"+h+"px;width:auto;overflow:visible;display:block",
      figureStyle, leftArmStyle, rightArmStyle, mouthStyle, eyesStyle,
      primary, secondary, label: p.label || "KU",
      labelColor,
      sleeveColor: top === "varsity" ? secondary : primary,
      packColor: p.packColor || "#3f4247",
      isHoodie: top === "hoodie", isTshirt: top === "tshirt", isVarsity: top === "varsity",
      hasCap: head === "cap", hasScarf: acc === "scarf", hasBackpack: acc === "backpack",
      isThinking: state === "thinking", isChanging: state === "changing"
    };
  }
}
</script>
</body>
</html>
